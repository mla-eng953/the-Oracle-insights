project_id = "oracle-insights"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/auth/callback"]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false

[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"

[auth.external.apple]
enabled = true
client_id = "env(SUPABASE_AUTH_APPLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_APPLE_SECRET)"

[functions.generate-picks]
verify_jwt = false
[functions.settle-picks]
verify_jwt = false
[functions.capture-closing-odds]
verify_jwt = false
[functions.live-scores]
verify_jwt = true
[functions.compliance-check]
verify_jwt = false
[functions.track-pick]
verify_jwt = true

[functions.stripe-webhook]
verify_jwt = false
[functions.apple-webhook]
verify_jwt = false
[functions.create-checkout-session]
verify_jwt = true
[functions.link-apple-receipt]
verify_jwt = true
[functions.persona-webhook]
verify_jwt = false
[functions.create-persona-inquiry]
verify_jwt = true
[functions.delete-account]
verify_jwt = true
