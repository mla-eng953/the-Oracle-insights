name: OracleApp
options:
  bundleIdPrefix: app.oracleinsights
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.10"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  OracleApp:
    type: application
    platform: iOS
    sources:
      - path: .
    resources:
      - path: products.json
      - path: StoreConfig.storekit
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Oracle
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        OracleWebURL: https://app.oracleinsights.app
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [arm64]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: OracleApp.entitlements
      properties:
        com.apple.developer.in-app-payments: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.oracleinsights.OracleApp
        INFOPLIST_FILE: Info.plist
        TARGETED_DEVICE_FAMILY: "1"
